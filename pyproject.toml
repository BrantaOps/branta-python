[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "branta"
version = "3.2.1"
description = "Python SDK for the Branta V2 API — payment destination lookup and registration with zero-knowledge encryption support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["bitcoin", "lightning", "payments", "branta", "crypto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://branta.pro"
Repository = "https://github.com/BrantaOps/branta-python"
Changelog = "https://github.com/BrantaOps/branta-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["branta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["branta"]
omit = ["tests/*"]
